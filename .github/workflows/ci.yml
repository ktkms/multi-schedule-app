name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mcp-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcp_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      MCP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55438/mcp_test
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_DB_PASSWORD: postgres
      NEXTAUTH_SECRET: test-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      ENABLE_DEV_LOGIN: 'false'
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: 'false'
      ALLOW_DEV_LOGIN_IN_PRODUCTION: 'false'
      NEXT_PUBLIC_ALLOW_DEV_LOGIN_IN_PRODUCTION: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
